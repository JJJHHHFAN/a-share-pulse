name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
      - name: Check scheduler syntax
        run: zsh -n scripts/update_local.sh scripts/install_local_schedule.sh
      - name: Run offline tests and snapshot checks
        run: python -m unittest discover -s tests -v
